name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (Swift 6, macOS)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          git rev-parse HEAD

      - name: Run complete baseline gate
        run: bash scripts/run_baseline_ci.sh
